<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>내 업무 한눈에</title>
<style>
:root{--ink:#16232e;--sub:#5b6b78;--line:#e3e8ec;--bg:#f6f8f9;--teal:#0f766e;--teal2:#e6f4f2;--amber:#b45309;--amber2:#fef3e2}
*{box-sizing:border-box}body{margin:0;font-family:"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;color:var(--ink);background:var(--bg);word-break:keep-all}
.wrap{max-width:1120px;margin:0 auto;padding:40px 28px 64px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin-bottom:28px}
h1{font-size:30px;margin:0 0 6px}.who{color:var(--sub);font-size:16px}.date{color:var(--sub);font-size:14px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:28px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 20px}.kpi b{display:block;font-size:30px}.kpi span{color:var(--sub);font-size:14px}
h2{font-size:19px;margin:30px 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 20px;display:flex;flex-direction:column;gap:8px}
.card h3{margin:0;font-size:17px}.tag{display:inline-block;font-size:12px;padding:2px 10px;border-radius:99px;background:var(--teal2);color:var(--teal);font-weight:700;margin-right:6px}
.tag.soon{background:var(--amber2);color:var(--amber)}.card p{margin:0;color:var(--sub);font-size:14px;line-height:1.55}
.files{font-size:13px;color:var(--sub);margin:0;padding-left:18px}.files li{margin:2px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.up{background:#fff;border:1px solid var(--line);border-radius:14px}.up div{display:flex;gap:16px;padding:14px 20px;border-top:1px solid var(--line)}.up div:first-child{border-top:0}
.up b{min-width:110px;color:var(--amber)}.bars{display:flex;align-items:flex-end;gap:4px;height:120px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.bar{flex:1;background:var(--teal);border-radius:4px 4px 0 0;min-height:2px;position:relative}.bar:hover::after{content:attr(data-t);position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font-size:12px;background:var(--ink);color:#fff;padding:2px 6px;border-radius:6px;white-space:nowrap}
.draft{display:block;background:var(--teal);color:#fff;text-decoration:none;border-radius:14px;padding:20px 24px;font-size:18px;font-weight:700;margin-top:10px}.draft span{display:block;font-weight:400;font-size:14px;opacity:.9;margin-top:4px}
footer{margin-top:36px;color:var(--sub);font-size:13px}
</style></head><body><div class="wrap" id="app"></div>
<script>
const D = /*DATA*/null;
const e = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const w = D.works || [], up = D.upcoming || [], days = D.activity || [];
const max = Math.max(1, ...days.map(d => d.count || 0));
document.getElementById('app').innerHTML = `
<header><div><h1>${e(D.title || '내 업무 한눈에')}</h1><div class="who">${e(D.person || '')}</div></div><div class="date">${e(D.date || '')}</div></header>
<div class="kpis">
 <div class="kpi"><b>${w.length}</b><span>파악한 업무</span></div>
 <div class="kpi"><b>${e(D.fileCount ?? '-')}</b><span>최근 ${e(D.days || 30)}일 작업 파일</span></div>
 <div class="kpi"><b>${up.length}</b><span>다가오는 일</span></div>
 <div class="kpi"><b>${(D.drafts || []).length}</b><span>미리 만든 초안</span></div>
</div>
${(D.drafts || []).map(d => `<a class="draft" href="${e(d.href)}">${e(d.title)}<span>${e(d.note || '')}</span></a>`).join('')}
<h2>업무</h2><div class="grid">${w.map(x => `<div class="card">
 <h3>${e(x.name)}</h3><div>${x.cycle ? `<span class="tag">${e(x.cycle)}</span>` : ''}${x.next ? `<span class="tag soon">${e(x.next)}</span>` : ''}</div>
 <p>${e(x.summary || '')}</p>${x.output ? `<p><b>결과물</b> ${e(x.output)}</p>` : ''}
 <ul class="files">${(x.files || []).slice(0, 4).map(f => `<li title="${e(f)}">${e(f.split(/[\\/]/).pop())}</li>`).join('')}</ul></div>`).join('')}</div>
${up.length ? `<h2>다가오는 일</h2><div class="up">${up.map(u => `<div><b>${e(u.when)}</b><span>${e(u.what)}</span></div>`).join('')}</div>` : ''}
${days.length ? `<h2>최근 작업 흐름</h2><div class="bars">${days.map(d => `<div class="bar" style="height:${Math.round((d.count||0)/max*100)}%" data-t="${e(d.date)} · ${e(d.count)}개"></div>`).join('')}</div>` : ''}
<footer>workmate · 이 화면은 Codex에게 "업무 한눈에 다시 만들어 줘"라고 하면 새로 만들어집니다.</footer>`;
</script></body></html>
